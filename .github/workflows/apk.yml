name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          corepack enable
          yarn install --network-timeout 600000

      - name: Build PWA
        run: yarn build

      - name: Add Android platform
        run: |
          test -d dist/pwa
          npm i -D @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6
          npx cap init "神代梦华谭" "work.star2000.sdmht" --web-dir dist/pwa
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sdmht-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
